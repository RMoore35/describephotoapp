{% extends "layout.html" %}

{% block title %}Your Corrected Text{% endblock %}

{% block content %}
    <h2>Great job! Here's your corrected English</h2>
    <img src="{{ image_url }}" alt="The image you described">

    <h3>Your original text:</h3>
    <p style="background:#f5f5f5; padding:20px; border-left:5px solid #999;">
        {{ user_text|replace("\n", "<br>")|safe }}
    </p>

    <h3>Corrected version:</h3>
    <p style="background:#e8f5e9; padding:20px; border-left:5px solid #27ae60;">
        {{ corrected|replace("\n", "<br>")|safe }}
    </p>

    <a href="/">Try another image</a>
{% endblock %}
